<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 48" width="108" height="48" role="img" aria-label="Dion"><title>Dion</title><style>@font-face{font-family:Bng;src:url(data:font/woff2;base64,) format('woff2')}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.inR{animation:inR .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes inR{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes stamp{0%{transform:scale(3.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.shake{transform-box:fill-box;transform-origin:center;animation:shake .5s steps(1) infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
.flA{animation:fl .3s steps(1) infinite}
.flB{animation:fl .3s steps(1) infinite;animation-delay:-.15s}
@keyframes fl{0%{opacity:1}50%{opacity:0}}
.zoom{transform-box:fill-box;transform-origin:center;animation:zoom .6s ease-out both}
@keyframes zoom{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fade .5s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style><defs><pattern id="tone" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.5" fill="#111"/></pattern><pattern id="toneL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="0.9" fill="#111"/></pattern><linearGradient id="gR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff"/></linearGradient><linearGradient id="gD" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="fadeR" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#gR)"/></mask><mask id="fadeD" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#gD)"/></mask></defs><polygon points="10,4 102.0,4 94.0,44 2,44" fill="#111" transform="translate(3,2)"/><polygon points="10,2 100.0,2 92.0,42 2,42" fill="#fff" stroke="#111" stroke-width="3"/><rect x="14" y="15.0" width="10" height="12" fill="#e0101e" transform="skewX(-12)"/><text x="34.0" y="32.0" font-family="Bng,Impact,'Arial Black',sans-serif" font-size="24" fill="#111" text-anchor="start" letter-spacing="1">DION</text></svg>